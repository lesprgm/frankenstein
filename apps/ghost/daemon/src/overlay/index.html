<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ghost Overlay</title>
    <link rel="stylesheet" href="style.css">
    <!-- D3.js loaded locally to avoid CDN dependency issues -->
    <script src="./d3.v7.min.js"></script>
</head>

<body>
    <div id="popup" class="source-popup" style="display: none;">
        <div class="popup-header">
            <div class="popup-header-content">
                <span class="popup-title">Ghost</span>
                <span class="state-badge" id="state-badge" style="display: none;">Done</span>
                <span class="source-count" id="source-count" style="display: none;">0 sources</span>
            </div>
            <button class="close-btn" id="close-btn">×</button>
        </div>
        
        <!-- New Response Section -->
        <div id="response-container" class="response-container" style="display: none;">
            <div id="response-text" class="response-text"></div>
        </div>

        <div id="choices-container" class="choices-container" style="display: none;">
            <div class="choices-title">Choose an option</div>
            <div id="choices-list" class="choices-list"></div>
        </div>

        <div id="actions-container" class="actions-container" style="display: none;">
            <div class="actions-title">Actions</div>
            <div id="actions-list" class="actions-list"></div>
        </div>

        <div class="sources-list" id="sources-list">
        </div>
        <div id="graph-container" class="graph-container" style="display: none;">
            <svg id="memory-graph" width="100%" height="160"></svg>
        </div>
        <div class="popup-footer">
            <button class="footer-btn" id="dismiss-btn">Dismiss</button>
        </div>
    </div>
    <div id="toast" class="toast">
        <div class="toast-title" id="toast-title"></div>
        <div class="toast-body" id="toast-body"></div>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
